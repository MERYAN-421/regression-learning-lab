catalog_version: "1.1.0"
description: "Catalog specification for Kaggle Regression Datasets with naturally 14-39 raw predictive features"

criteria:
  min_raw_features: 14
  max_raw_features: 39
  target_type: "continuous"
  note: "Each dataset must natively possess 14-39 available predictive features in its raw form without artificial pre-filtering."

verified_candidates:
  - id: "appliances_energy"
    name: "Appliances Energy Prediction"
    source: "kaggle:loveall/appliances-energy-prediction (UCI ML Repository)"
    domain: "Energy Consumption & Smart Buildings"
    target_variable: "Appliances"
    target_type: "continuous"
    target_unit: "Watt-hours (Wh)"
    raw_feature_count: 28
    usable_feature_range: "26-28 raw predictive features"
    statistical_challenges:
      - "High collinearity among multi-room temperature (T1-T9) and humidity (RH1-RH9) sensors"
      - "Outdoor meteorological exogenous influences (T_out, Pressure, Windspeed)"
      - "Temporal autocorrelation and periodic diurnal cycles"
    status: "verified_candidate"

  - id: "kc_house_sales"
    name: "House Sales in King County, USA"
    source: "kaggle:harlfoxem/housesalesprediction"
    domain: "Real Estate Valuation"
    target_variable: "price"
    target_type: "continuous"
    target_unit: "USD"
    raw_feature_count: 20
    usable_feature_range: "18-19 raw predictive features (excluding ID/date)"
    statistical_challenges:
      - "Right-skewed price distribution requiring logarithmic transformation"
      - "Spatial collinearity (lat, long, zipcode) and structural interactions (sqft_living vs sqft_above/basement)"
      - "Heteroscedasticity across luxury property segments"
    status: "verified_candidate"

  - id: "life_expectancy"
    name: "Life Expectancy (WHO Global Health Observatory)"
    source: "kaggle:kumarajarshi/life-expectancy-who"
    domain: "Public Health & Demographics"
    target_variable: "Life expectancy"
    target_type: "continuous"
    target_unit: "Years"
    raw_feature_count: 21
    usable_feature_range: "21 raw predictive features"
    statistical_challenges:
      - "Missing data patterns in developing economies across immunization and GDP"
      - "Multicollinearity between infant deaths and under-five deaths"
      - "Socio-economic interaction effects (Schooling * Income composition)"
    status: "verified_candidate"

  - id: "student_performance"
    name: "Student Performance (Secondary Education Math)"
    source: "kaggle:uciml/student-alcohol-consumption (UCI ML Repository)"
    domain: "Educational Data Mining"
    target_variable: "G3"
    target_type: "continuous"
    target_unit: "Grade score (0-20 scale)"
    raw_feature_count: 32
    usable_feature_range: "30-32 raw predictive features"
    statistical_challenges:
      - "Mixed tabular feature types (binary, categorical ordinal, and continuous)"
      - "Zero-inflation boundary effects in final exam score"
      - "Strong feature ranking dynamics across social and academic predictors"
    status: "verified_candidate"

unverified_or_excluded:
  - id: "ames_house_prices"
    reason: "Original raw dataset contains 81 columns (>39 features). Arbitrary feature pre-selection violates raw dimensionality criterion."
    status: "unverified_excluded"
  - id: "concrete_compressive_strength"
    reason: "Original raw dataset contains only 9 columns (8 predictive features < 14). Violates minimum feature threshold."
    status: "unverified_excluded"
