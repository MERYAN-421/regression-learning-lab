catalog_version: "2.1.0"
description: "Single Source of Truth for Regression Learning Lab Datasets (14-39 Usable Predictors)"

criteria:
  min_raw_features: 14
  max_raw_features: 39
  min_usable_features: 14
  max_usable_features: 39
  target_type: "continuous"
  allowed_split_strategies:
    - "random"
    - "temporal"
    - "group"

datasets:
  - id: "appliances_energy"
    name: "Appliances Energy Prediction"
    source: "UCI Machine Learning Repository / Kaggle (loveall/appliances-energy-prediction)"
    source_provider: "UCI Machine Learning Repository / Kaggle"
    kaggle_url: "https://www.kaggle.com/datasets/loveall/appliances-energy-prediction"
    original_reference: "Candanedo, L. M., Feldheim, V., & Deramaix, D. (2017). Energy and Buildings, 140, 81-97."
    download_mirror_url: "https://archive.ics.uci.edu/static/public/374/appliances+energy+prediction.zip"
    provenance_notes: "UCI Machine Learning Repository Official Archive (Dataset #374). Direct canonical download source mirroring the Kaggle repository."
    sha256_checksum: "2820bf712ad0275cb18b85a05250926100d8e65ebb9f4d2d016ca91ea152a25d"
    local_path: "data/raw/appliances_energy.csv"
    csv_separator: ","
    encoding: "utf-8"
    target_column: "Appliances"
    target_variable: "Appliances"
    target_type: "continuous"
    target_unit: "Watt-hours (Wh)"
    target_nature: "Continuous (Energy consumption)"
    date_column: "date"
    group_column: null
    identifier_columns: []
    metadata_columns:
      - "date"
    excluded_predictor_columns:
      - "date"
    expected_rows: 19735
    expected_original_columns: 29
    raw_feature_count: 28
    expected_usable_features: 27
    recommended_split: "temporal"
    default_split_ratios: [0.70, 0.15, 0.15]
    default_random_seed: 42
    license_notes: "Creative Commons Attribution 4.0 International (CC BY 4.0)"
    domain: "Energy Consumption & Smart Building IoT"
    description: "Regression modeling of home appliances energy consumption recorded every 10 minutes over 4.5 months with multi-room sensor readings and local weather conditions."
    learning_objectives:
      - "Handle high-dimensional collinear sensor clusters (temperature T1-T9 and humidity RH1-RH9)"
      - "Understand temporal splitting to prevent forward-looking data leakage"
      - "Assess lagged relationships between weather dynamics and domestic energy use"
    status: "verified_candidate"

